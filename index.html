
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #f4f1ec;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        .gallery {
            width: 100%;
            max-width: 1100px;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }

        .photo {
            width: 50%;
            max-height: 85vh;

            object-fit: cover;

            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.18);

            transition: 0.3s ease;
        }

        .photo:hover {
            transform: scale(1.02);
        }

        /* Mobile */
        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .gallery {
                flex-direction: column;
                gap: 20px;
            }

            .photo {
                width: 100%;
                max-height: none;
            }
        }
    </style>
</head>

<body>

    <div class="gallery">

        <img src="photo1.jpg" class="photo" alt="Photo 1">

        <img src="photo2.jpg" class="photo" alt="Photo 2">

    </div>

</body>
</html>
